[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "github-engineering-intelligence"
version = "0.6.0"
description = "Tool-assisted GitHub engineering investigations with grounded cited answers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aayushi Akhouri" }]
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.20,<2",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "qdrant-client>=1.10,<2",
  "sentence-transformers>=3.0,<6",
  "structlog>=24.1,<26",
  "tenacity>=8.2,<10",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<2",
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.5,<1",
]

[project.scripts]
github-intel = "github_intelligence.cli:main"
github-intel-mcp = "github_intelligence.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/github_intelligence"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config -q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["github_intelligence"]
